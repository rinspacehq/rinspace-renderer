name: Renderer candidate image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Build exactly one candidate component
        required: true
        type: choice
        options:
          - latexml-base
          - runtime
          - latex-pdf
          - typst-pdf
      renderer_base_image:
        description: Exact latexml-base digest, required only for runtime
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: renderer-heavy-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'rinspacehq/rinspace-renderer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      reference: ${{ steps.inputs.outputs.image }}@${{ steps.build.outputs.digest }}
    env:
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable build inputs
        id: inputs
        env:
          COMPONENT: ${{ inputs.component }}
          BASE: ${{ inputs.renderer_base_image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            latexml-base) file=deploy/Dockerfile.latexml; target=runtime ;;
            runtime) file=deploy/Dockerfile.runtime; target= ;;
            latex-pdf) file=deploy/Dockerfile.latex-pdf; target= ;;
            typst-pdf) file=deploy/Dockerfile.typst-pdf; target= ;;
            *) exit 2 ;;
          esac
          if [ "$COMPONENT" = runtime ]; then
            [[ "$BASE" =~ ^ghcr\.io/rinspacehq/rinspace-renderer/latexml-base@sha256:[a-f0-9]{64}$ ]] || exit 2
          else
            [ -z "$BASE" ] || exit 2
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/rinspacehq/rinspace-renderer/$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          source_hash="$(find deploy -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "source_hash=$source_hash" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify runtime base came from this exact source
        if: inputs.component == 'runtime'
        env:
          BASE: ${{ steps.inputs.outputs.base }}
        run: |
          docker pull "$BASE"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BASE")"
          test "$revision" = "$GITHUB_SHA"
      - name: Build and push candidate by commit tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.inputs.outputs.file }}
          target: ${{ steps.inputs.outputs.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.inputs.outputs.image }}:candidate-${{ github.sha }}
          build-args: |
            RENDERER_SOURCE_ROOT=.
            SOURCE_HASH=${{ steps.inputs.outputs.source_hash }}
            RENDERER_BASE_IMAGE=${{ steps.inputs.outputs.base }}
          labels: |
            org.opencontainers.image.source=https://github.com/rinspacehq/rinspace-renderer
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable candidate reference
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE: ${{ steps.inputs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE: ${{ steps.inputs.outputs.base }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (!/^sha256:[a-f0-9]{64}$/.test(process.env.DIGEST)) throw new Error('missing OCI digest');
          const result = {
            schemaVersion: 'rin-renderer-image-candidate/v1',
            component: process.env.COMPONENT,
            sourceCommit: process.env.GITHUB_SHA,
            platform: 'linux/amd64',
            reference: `${process.env.IMAGE}@${process.env.DIGEST}`,
            rendererBaseImage: process.env.BASE || null,
            workflowRun: process.env.GITHUB_RUN_ID,
            status: 'candidate-only',
          };
          writeFileSync('renderer-image-candidate.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(result.reference);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-image-candidate-${{ inputs.component }}-${{ github.sha }}
          path: renderer-image-candidate.json
          if-no-files-found: error

  evidence:
    needs: candidate
    if: inputs.component != 'latexml-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPONENT: ${{ inputs.component }}
      REFERENCE: ${{ needs.candidate.outputs.reference }}
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect the exact built image and capture installed package notices
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REFERENCE" =~ ^ghcr\.io/rinspacehq/rinspace-renderer/${COMPONENT}@sha256:[a-f0-9]{64}$ ]]
          mkdir -p evidence/notices/system evidence/notices/image evidence/notices/renderer-source
          docker pull "$REFERENCE"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REFERENCE")"
          test "$revision" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --user 0 --cap-drop ALL \
            --entrypoint /usr/bin/dpkg-query "$REFERENCE" \
            -W '-f=${binary:Package}\t${Version}\n' > evidence/dpkg-packages.tsv
          docker run --rm --network none --read-only --user 0 --cap-drop ALL \
            --entrypoint /bin/sh "$REFERENCE" -c \
            'find -L /usr/share/doc /usr/share/common-licenses -type f \( -iname "copyright*" -o -iname "LICENSE*" -o -iname "COPYING*" -o -iname "NOTICE*" -o -path "/usr/share/common-licenses/*" \) -print0 | tar --dereference --null -T - -cf -' \
            > evidence/system-notices.tar
          tar -xf evidence/system-notices.tar -C evidence/notices/system
          if [ "$COMPONENT" = runtime ]; then
            docker run --rm --network none --read-only --user 0 --cap-drop ALL \
              --entrypoint /bin/sh "$REFERENCE" -c \
              'find -L /opt/rin-renderer/engines -type f \( -iname "LICENSE*" -o -iname "NOTICE*" -o -name package.json \) -print0 | tar --dereference --null -T - -cf -' \
              > evidence/node-notices.tar
            tar -xf evidence/node-notices.tar -C evidence/notices/image
            (cd api && go mod download && go list -m -f '{{.Path}}@{{.Version}}|{{.Dir}}' all) > evidence/go-modules.tsv
            node deploy/collect-go-notices.mjs evidence/go-modules.tsv evidence/notices/go
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md evidence/notices/renderer-source/
          if [ "$COMPONENT" = runtime ]; then
            cp engines/latexml/latexml.lock deploy/Dockerfile.runtime evidence/notices/renderer-source/
          else
            cp "deploy/${COMPONENT}.lock.json" evidence/notices/renderer-source/
          fi
          node deploy/fetch-notice-sources.mjs deploy/notice-sources.lock.json evidence/notices/upstream
      - name: Seal SPDX and the full notice bundle
        shell: bash
        run: |
          set -euo pipefail
          args=(--component "$COMPONENT" --reference "$REFERENCE" --dpkg evidence/dpkg-packages.tsv \
            --output "evidence/${COMPONENT}.spdx.json")
          if [ "$COMPONENT" = runtime ]; then args+=(--go-modules evidence/go-modules.tsv); fi
          node deploy/generate-image-sbom.mjs "${args[@]}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C evidence/notices -czf "evidence/${COMPONENT}.NOTICES.tar.gz" .
          COMPONENT="$COMPONENT" REFERENCE="$REFERENCE" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const component = process.env.COMPONENT;
          const result = {
            schemaVersion: 'rin-renderer-image-evidence/v1',
            sourceCommit: process.env.GITHUB_SHA,
            component,
            reference: process.env.REFERENCE,
            sbomSha256: sha256(`evidence/${component}.spdx.json`),
            noticeSha256: sha256(`evidence/${component}.NOTICES.tar.gz`),
            status: 'candidate-only',
          };
          writeFileSync('evidence/image-evidence.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-image-evidence-${{ inputs.component }}-${{ github.sha }}
          path: |
            evidence/*.spdx.json
            evidence/*.NOTICES.tar.gz
            evidence/image-evidence.json
          if-no-files-found: error
