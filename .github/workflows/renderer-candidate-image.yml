name: Renderer candidate image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Build exactly one candidate component
        required: true
        type: choice
        options:
          - latexml-base
          - runtime
          - latex-pdf
          - typst-pdf
      renderer_base_image:
        description: Exact latexml-base digest, required only for runtime
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: renderer-heavy-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'rinspacehq/rinspace-renderer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      reference: ${{ steps.inputs.outputs.image }}@${{ steps.build.outputs.digest }}
    env:
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable build inputs
        id: inputs
        env:
          COMPONENT: ${{ inputs.component }}
          BASE: ${{ inputs.renderer_base_image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            latexml-base) file=deploy/Dockerfile.latexml; target=runtime ;;
            runtime) file=deploy/Dockerfile.runtime; target= ;;
            latex-pdf) file=deploy/Dockerfile.latex-pdf; target= ;;
            typst-pdf) file=deploy/Dockerfile.typst-pdf; target= ;;
            *) exit 2 ;;
          esac
          if [ "$COMPONENT" = runtime ]; then
            [[ "$BASE" =~ ^ghcr\.io/rinspacehq/rinspace-renderer/latexml-base@sha256:[a-f0-9]{64}$ ]] || exit 2
          else
            [ -z "$BASE" ] || exit 2
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/rinspacehq/rinspace-renderer/$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          source_hash="$(find deploy -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "source_hash=$source_hash" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reviewed immutable runtime base
        if: inputs.component == 'runtime'
        env:
          BASE: ${{ steps.inputs.outputs.base }}
        run: |
          docker pull "$BASE"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$BASE")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BASE")"
          test "$source" = 'https://github.com/rinspacehq/rinspace-renderer'
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
      - name: Build and push candidate by commit tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.inputs.outputs.file }}
          target: ${{ steps.inputs.outputs.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.inputs.outputs.image }}:candidate-${{ github.sha }}
          build-args: |
            RENDERER_SOURCE_ROOT=.
            SOURCE_HASH=${{ steps.inputs.outputs.source_hash }}
            RENDERER_BASE_IMAGE=${{ steps.inputs.outputs.base }}
          labels: |
            org.opencontainers.image.source=https://github.com/rinspacehq/rinspace-renderer
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable candidate reference
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE: ${{ steps.inputs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE: ${{ steps.inputs.outputs.base }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (!/^sha256:[a-f0-9]{64}$/.test(process.env.DIGEST)) throw new Error('missing OCI digest');
          const result = {
            schemaVersion: 'rin-renderer-image-candidate/v1',
            component: process.env.COMPONENT,
            sourceCommit: process.env.GITHUB_SHA,
            platform: 'linux/amd64',
            reference: `${process.env.IMAGE}@${process.env.DIGEST}`,
            rendererBaseImage: process.env.BASE || null,
            workflowRun: process.env.GITHUB_RUN_ID,
            status: 'candidate-only',
          };
          writeFileSync('renderer-image-candidate.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(result.reference);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-image-candidate-${{ inputs.component }}-${{ github.sha }}
          path: renderer-image-candidate.json
          if-no-files-found: error

  evidence:
    needs: candidate
    if: inputs.component != 'latexml-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPONENT: ${{ inputs.component }}
      REFERENCE: ${{ needs.candidate.outputs.reference }}
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect the exact built image and capture installed package notices
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REFERENCE" =~ ^ghcr\.io/rinspacehq/rinspace-renderer/${COMPONENT}@sha256:[a-f0-9]{64}$ ]]
          mkdir -p evidence/notices/system evidence/notices/image evidence/notices/renderer-source
          docker pull "$REFERENCE"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REFERENCE")"
          test "$revision" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --user 0 --cap-drop ALL \
            --entrypoint /usr/bin/dpkg-query "$REFERENCE" \
            -W '-f=${binary:Package}\t${Version}\n' > evidence/dpkg-packages.tsv
          docker run --rm --network none --read-only --user 0 --cap-drop ALL \
            --entrypoint /bin/sh "$REFERENCE" -c \
            'find /usr/share/doc /usr/share/common-licenses \( -type f -o -type l \) \( -iname "copyright*" -o -iname "LICENSE*" -o -iname "COPYING*" -o -iname "NOTICE*" -o -path "/usr/share/common-licenses/*" \) -print0 | tar --dereference --null -T - -cf -' \
            > evidence/system-notices.tar
          tar -xf evidence/system-notices.tar -C evidence/notices/system
          if [ "$COMPONENT" = runtime ]; then
            docker run --rm --network none --read-only --user 0 --cap-drop ALL \
              --entrypoint /bin/sh "$REFERENCE" -c \
              'find /opt/rin-renderer/engines \( -type f -o -type l \) \( -iname "LICENSE*" -o -iname "NOTICE*" -o -name package.json \) -print0 | tar --dereference --null -T - -cf -' \
              > evidence/node-notices.tar
            tar -xf evidence/node-notices.tar -C evidence/notices/image
            (cd api && go mod download all && go list -m -f '{{.Path}}@{{.Version}}|{{.Dir}}' all) > evidence/go-modules.tsv
            node deploy/collect-go-notices.mjs evidence/go-modules.tsv evidence/notices/go
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md evidence/notices/renderer-source/
          if [ "$COMPONENT" = runtime ]; then
            cp engines/latexml/latexml.lock deploy/Dockerfile.runtime deploy/markdown-pdf-browser.lock.json evidence/notices/renderer-source/
          else
            cp "deploy/${COMPONENT}.lock.json" evidence/notices/renderer-source/
          fi
          if [ "$COMPONENT" = typst-pdf ]; then
            cp deploy/typst-html-toolchain.lock.json evidence/notices/renderer-source/
            docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
              --entrypoint /bin/tar "$REFERENCE" -cf - -C /opt/rinspace/typst-package-cache . \
              > evidence/typst-preview-sources.tar
            mkdir -p evidence/notices/typst-preview-sources
            tar -xf evidence/typst-preview-sources.tar -C evidence/notices/typst-preview-sources
            node deploy/typst-packages.mjs verify deploy/typst-html-toolchain.lock.json evidence/notices/typst-preview-sources
          fi
          node deploy/fetch-notice-sources.mjs deploy/notice-sources.lock.json evidence/notices/upstream
      - name: Verify installed Chromium and CJK fonts in the exact runtime image
        if: inputs.component == 'runtime'
        shell: bash
        run: |
          set -euo pipefail
          browser_hash="$(jq -er .executableSha256 deploy/markdown-pdf-browser.lock.json)"
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 256m --pids-limit 64 \
            --env "EXPECTED_BROWSER_SHA256=$browser_hash" --entrypoint /bin/bash "$REFERENCE" -ec '
              path="$RIN_RENDERER_MARKDOWN_PDF_CHROMIUM"
              printf "%s  %s\n" "$EXPECTED_BROWSER_SHA256" "$path" | sha256sum -c -
              test -s "$(dirname "$path")/LICENSE.headless_shell"
              libraries="$(ldd "$path")"
              printf "%s\n" "$libraries"
              if grep -Fq "not found" <<< "$libraries"; then exit 1; fi
              fc-list :lang=zh family | grep -F "Noto Serif CJK SC"
            ' | tee evidence/markdown-pdf-runtime.txt
      - name: Exercise the publication sandbox from a root Renderer runtime
        if: inputs.component == 'runtime'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$PWD/evidence/docker-seccomp-base.json"
          profile="$PWD/evidence/markdown-pdf-seccomp.json"
          curl -fsS --proto '=https' --max-time 30 \
            'https://raw.githubusercontent.com/moby/profiles/9ee3204f0d0cfa19ca2c6a7b0fcf5a2b353954ae/seccomp/default.json' -o "$baseline"
          printf '3320527d4568265ac97a077609b1bfd4cfd0d789eeb9239b7e094b1526675406  %s\n' "$baseline" | sha256sum -c -
          node --input-type=module - "$baseline" "$profile" <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const [baseline,output] = process.argv.slice(2);
          const profile = JSON.parse(readFileSync(baseline));
          profile.syscalls.push({
            names:['clone','setns','unshare'],action:'SCMP_ACT_ALLOW',
            comment:'Allow Chromium to create its user and network namespaces',
          }, {
            names:['chroot'],action:'SCMP_ACT_ALLOW',
            comment:'Allow Chromium to restrict the filesystem in its own user namespace',
          });
          writeFileSync(output, JSON.stringify(profile, null, 2) + '\n');
          NODE
          (cd api && CGO_ENABLED=0 go test -c -o ../evidence/browser.test ./internal/publicationpdf)
          docker run --rm --network none --read-only --user 0 --cap-drop SYS_CHROOT \
            --ipc none --init --security-opt no-new-privileges --security-opt "seccomp=$profile" \
            --cpus 1 --memory 1024m --memory-swap 1024m --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$PWD/evidence/browser.test,dst=/browser.test,readonly" \
            --workdir /opt/rin-renderer/engines/markdown-pdf/chromium \
            --env RIN_RENDERER_TEST_PDF_ISOLATION=1 --entrypoint /browser.test "$REFERENCE" \
            -test.run '^TestBrowserPrinter$' -test.v | tee evidence/markdown-pdf-sandbox.txt
      - name: Native math SVG contract in the exact runtime image
        if: inputs.component == 'runtime'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 0 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 512m --pids-limit 96 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=${PWD}/engines/texsvg/native-math.test.mjs,dst=/native-math.test.mjs,readonly" \
            --entrypoint node "$REFERENCE" /native-math.test.mjs
      - name: Verify committed LaTeX entrypoint in the exact compiler image
        if: inputs.component == 'latex-pdf'
        shell: bash
        run: |
          set -euo pipefail
          sample="$(mktemp -d)"
          mkdir -p "$sample/workspace/chapters" "$sample/output"
          chmod 0777 "$sample/output"
          cat > "$sample/workspace/main.ltx" <<'TEX'
          \documentclass{article}
          \usepackage[2.0,compress]{bxpdfver}
          \usepackage{fontspec,courierten,biolinum,algorithm2e}
          \usepackage[cal=boondoxo]{mathalpha}
          \newfontfamily\song{SimSun}
          \newfontfamily\hei{SimHei}
          \begin{document}
          {\song 中文正文。} {\hei\bfseries 中文标题。} $\mathcal{C}$.
          \textsf{Biolinum} \texttt{Courier}
          \begin{algorithm}
          \KwIn{A number}
          \end{algorithm}
          \include{chapters/last}
          \end{document}
          TEX
          printf '%s\n' 'Final chapter from the same archive.' > "$sample/workspace/chapters/last.tex"
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/output,dst=/output" \
            "$REFERENCE" main.ltx
          test "$(head -c 8 "$sample/output/main.pdf")" = '%PDF-2.0'
          test -s "$sample/output/chapters/last.aux"
          sha256sum "$sample/output/main.pdf" | tee evidence/latex-publication-pdf.sha256
          mkdir "$sample/legacy-output"
          chmod 0777 "$sample/legacy-output"
          cat > "$sample/workspace/legacy.tex" <<'TEX'
          \documentclass{article}
          \begin{document}
          \begin{tikzcd} A \arrow[r] & B \end{tikzcd}
          \end{document}
          TEX
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/legacy-output,dst=/output" \
            "$REFERENCE" legacy.tex
          grep -Fxq 'Rinspace legacy package: tikz-cd' "$sample/legacy-output/compile.log"
          test "$(head -c 5 "$sample/legacy-output/legacy.pdf")" = '%PDF-'
          sha256sum "$sample/legacy-output/legacy.pdf" | tee evidence/latex-legacy-package-pdf.sha256
          mkdir "$sample/theorem-output"
          chmod 0777 "$sample/theorem-output"
          cat > "$sample/workspace/theorems.tex" <<'TEX'
          \documentclass{article}
          \usepackage{amsmath,amsthm}
          \newtheorem{lemma}{Author lemma}
          \begin{document}
          中文测试。
          \begin{lemma} Keep the declared theorem. \end{lemma}
          \ifnum\value{lemma}=1\else\errmessage{Lost the original theorem counter}\fi
          \begin{definition} An unnumbered definition. \end{definition}
          \ifcsname c@definition\endcsname\errmessage{Invented a definition number}\fi
          Accent in a math subscript: $T_{ét}$.
          \[\begin{tikzcd} A \arrow[r] & B \end{tikzcd}\]
          \end{document}
          TEX
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/theorem-output,dst=/output" \
            "$REFERENCE" theorems.tex
          grep -Fxq 'Rinspace legacy format: unnumbered-theorems' "$sample/theorem-output/compile.log"
          if grep -Fq 'Missing character:' "$sample/theorem-output/compile.log"; then
            grep -F 'Missing character:' "$sample/theorem-output/compile.log" >&2
            exit 1
          fi
          test "$(head -c 5 "$sample/theorem-output/theorems.pdf")" = '%PDF-'
          sha256sum "$sample/theorem-output/theorems.pdf" | tee evidence/latex-legacy-theorem-pdf.sha256
          mkdir "$sample/enumeration-output"
          chmod 0777 "$sample/enumeration-output"
          cat > "$sample/workspace/enumeration.tex" <<'TEX'
          \documentclass{article}
          \usepackage{amsmath,amsthm}
          \newtheorem{lemma}{Lemma}
          \begin{document}
          中文列表。
          \[\begin{tikzcd} A \arrow[r] & B \end{tikzcd}\]
          \begin{lemma} A labeled list.
          \begin{enumerate}[(a)]
          \item $\mathscr{A}\coloneqq B$
          \item Another choice.
          \ifnum\value{enumi}=2\else\errmessage{Lost the list counter}\fi
          \end{enumerate}
          \end{lemma}
          \end{document}
          TEX
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/enumeration-output,dst=/output" \
            "$REFERENCE" enumeration.tex
          grep -Fxq 'Rinspace legacy format: legacy-enumeration' "$sample/enumeration-output/compile.log"
          if grep -Fq 'Missing character:' "$sample/enumeration-output/compile.log"; then
            grep -F 'Missing character:' "$sample/enumeration-output/compile.log" >&2
            exit 1
          fi
          test "$(head -c 5 "$sample/enumeration-output/enumeration.pdf")" = '%PDF-'
          sha256sum "$sample/enumeration-output/enumeration.pdf" | tee evidence/latex-legacy-enumeration-pdf.sha256
          mkdir "$sample/script-workspace" "$sample/script-output"
          chmod 0777 "$sample/script-output"
          cat > "$sample/script-workspace/math-script.tex" <<'TEX'
          \documentclass{article}
          \usepackage{amsmath}
          \begin{document}
          中文公式。 $\mathscr{A}$.
          \[\begin{tikzcd} A \arrow[r] & B \end{tikzcd}\]
          \end{document}
          TEX
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/script-workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/script-output,dst=/output" \
            "$REFERENCE" math-script.tex
          grep -Fxq 'Rinspace legacy package: mathrsfs' "$sample/script-output/compile.log"
          if grep -Fq 'Missing character:' "$sample/script-output/compile.log"; then
            grep -F 'Missing character:' "$sample/script-output/compile.log" >&2
            exit 1
          fi
          test "$(head -c 5 "$sample/script-output/math-script.pdf")" = '%PDF-'
          sha256sum "$sample/script-output/math-script.pdf" | tee evidence/latex-legacy-math-script-pdf.sha256
          mkdir "$sample/bibliography-output"
          chmod 0777 "$sample/bibliography-output"
          cat > "$sample/workspace/bibliography.tex" <<'TEX'
          \documentclass{article}
          \usepackage{fontspec,bbding,adforn,cmupint,extarrows,physics,soul}
          \setmainfont[
            UprightFont=*-Regular,ItalicFont=*-Italic,BoldFont=*-Bold,BoldItalicFont=*-BoldItalic,
            Extension=.otf
          ]{TeXGyreTermesX}
          \usepackage[backend=biber]{biblatex}
          \addbibresource{references.bib}
          \begin{document}
          \Checkmark{} \textit{Offline typesetting} \parencite{example}.
          \printbibliography
          \end{document}
          TEX
          printf '%s\n' '@book{example,author={A. Example},title={Reference Example},year={2024}}' \
            > "$sample/workspace/references.bib"
          flags=(--rm --network none --read-only --user 65532:65532 --cap-drop ALL
            --security-opt no-new-privileges --cpus 1 --memory 1536m --memory-swap 1536m --pids-limit 256
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777)
          docker run "${flags[@]}" --entrypoint /usr/local/bin/verify-latex-pdf-runtime "$REFERENCE" \
            | tee evidence/latex-pdf-runtime.txt
          docker run "${flags[@]}" \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/bibliography-output,dst=/output" \
            "$REFERENCE" bibliography.tex
          test "$(head -c 5 "$sample/bibliography-output/bibliography.pdf")" = '%PDF-'
          grep -Fq '\entry{example}{book}' "$sample/bibliography-output/bibliography.bbl"
          sha256sum "$sample/bibliography-output/bibliography.pdf" | tee evidence/latex-bibliography-pdf.sha256
      - name: Exercise the sealed package cache in the exact Typst image
        if: inputs.component == 'typst-pdf'
        shell: bash
        run: |
          set -euo pipefail
          flags=(--rm --network none --read-only --user 65532:65532 --cap-drop ALL
            --security-opt no-new-privileges --cpus 1 --memory 768m --memory-swap 768m --pids-limit 128)
          docker run "${flags[@]}" --entrypoint /usr/local/bin/verify-typst-pdf-runtime "$REFERENCE" \
            | tee evidence/typst-pdf-runtime.txt
          sample="$(mktemp -d)"
          trap 'rm -rf -- "$sample"' EXIT
          mkdir "$sample/workspace" "$sample/output"
          chmod 0777 "$sample/output"
          printf '%s\n' '#import "@preview/ctheorems:1.1.3": thmbox' '= Offline PDF import' > "$sample/workspace/main.typ"
          docker run "${flags[@]}" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount "type=bind,src=$sample/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=$sample/output,dst=/output" \
            "$REFERENCE" main.typ
          test "$(head -c 5 "$sample/output/main.pdf")" = '%PDF-'
          sha256sum "$sample/output/main.pdf" | tee evidence/typst-publication-pdf.sha256
      - name: Seal SPDX and the full notice bundle
        shell: bash
        run: |
          set -euo pipefail
          args=(--component "$COMPONENT" --reference "$REFERENCE" --dpkg evidence/dpkg-packages.tsv \
            --output "evidence/${COMPONENT}.spdx.json")
          if [ "$COMPONENT" = runtime ]; then args+=(--go-modules evidence/go-modules.tsv); fi
          node deploy/generate-image-sbom.mjs "${args[@]}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C evidence/notices -czf "evidence/${COMPONENT}.NOTICES.tar.gz" .
          COMPONENT="$COMPONENT" REFERENCE="$REFERENCE" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const component = process.env.COMPONENT;
          const result = {
            schemaVersion: 'rin-renderer-image-evidence/v1',
            sourceCommit: process.env.GITHUB_SHA,
            component,
            reference: process.env.REFERENCE,
            sbomSha256: sha256(`evidence/${component}.spdx.json`),
            noticeSha256: sha256(`evidence/${component}.NOTICES.tar.gz`),
            status: 'candidate-only',
          };
          writeFileSync('evidence/image-evidence.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-image-evidence-${{ inputs.component }}-${{ github.sha }}
          path: |
            evidence/*.spdx.json
            evidence/*.NOTICES.tar.gz
            evidence/image-evidence.json
            evidence/markdown-pdf-sandbox.txt
            evidence/latex-legacy-package-pdf.sha256
            evidence/latex-legacy-theorem-pdf.sha256
            evidence/latex-legacy-enumeration-pdf.sha256
            evidence/latex-legacy-math-script-pdf.sha256
            evidence/latex-pdf-runtime.txt
            evidence/latex-bibliography-pdf.sha256
