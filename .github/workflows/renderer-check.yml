name: Renderer source checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: renderer-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_policy:
    name: Source and protocol checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Source and protocol checks
        run: |
          git diff --check
          node packages/protocol/validate-protocol.mjs
          node --test packages/document-contract/embedded-assets.test.mjs
          node engines/markdown/verify-isolation.mjs
          node --test deploy/source-policy.test.mjs deploy/npm-registry.test.mjs deploy/typst-packages.test.mjs deploy/serve-shadow-storage.test.mjs deploy/verify-release-manifest.test.mjs deploy/release-evidence.test.mjs

  markdown:
    name: Markdown contract suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: engines/markdown/package-lock.json
      - name: Install pinned Markdown runtime
        run: npm --prefix engines/markdown ci --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always --fetch-timeout=60000 --fetch-retries=2
      - name: Markdown contract suite
        working-directory: engines/markdown
        run: npm run check

  api:
    name: Go API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "1"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            engines/markdown/package-lock.json
            engines/mathjax/package-lock.json
            engines/katex/package-lock.json
      - name: Install pinned Node runtimes serially
        run: |
          npm --prefix engines/markdown ci --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always --fetch-timeout=60000 --fetch-retries=2
          npm --prefix engines/mathjax ci --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always --fetch-timeout=60000 --fetch-retries=2
          npm --prefix engines/katex ci --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always --fetch-timeout=60000 --fetch-retries=2
      - name: Real MathJax CHTML finalizer contract
        run: node engines/markdown/mathjax-finalizer.test.mjs
      - name: Prepare locked Typst compiler for native regressions
        run: node deploy/prepare-typst-test-runtime.mjs "${RUNNER_TEMP}/rin-typst-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Go API tests
        working-directory: api
        run: go test ./... -count=1

  tex_svg:
    name: TeX SVG tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: "1"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: engines/texsvg/go.sum
      - name: TeX SVG tests
        working-directory: engines/texsvg
        run: go test ./... -count=1

  markdown_pdf:
    name: Markdown PDF browser checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: engines/markdown-pdf/package-lock.json
      - name: Prepare the pinned print toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix engines/markdown-pdf ci --omit=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always --fetch-timeout=60000 --fetch-retries=2
          lock=deploy/markdown-pdf-browser.lock.json
          browser_dir="$(mktemp -d "$RUNNER_TEMP/markdown-pdf.XXXXXX")"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "$(jq -er .release "$lock")" -o "$browser_dir/browser.zip"
          printf '%s  %s\n' "$(jq -er .archiveSha256 "$lock")" "$browser_dir/browser.zip" | sha256sum -c -
          unzip -q "$browser_dir/browser.zip" -d "$browser_dir"
          browser="$browser_dir/$(jq -er .executable "$lock")"
          printf '%s  %s\n' "$(jq -er .executableSha256 "$lock")" "$browser" | sha256sum -c -
          test -s "$browser_dir/$(jq -er .notice "$lock")"
          printf 'RIN_RENDERER_MARKDOWN_PDF_CHROMIUM=%s\n' "$browser" >> "$GITHUB_ENV"
          printf 'RIN_RENDERER_MARKDOWN_NODE_BIN=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - name: Print and inspect a book in sandboxed Chromium
        working-directory: api
        run: go test ./internal/publicationpdf ./internal/jobapi -count=1 -run 'Test(BrowserPrinter|PublicationPDFChromium)' -v

  source:
    name: source
    if: ${{ always() }}
    needs: [source_policy, markdown, api, tex_svg, markdown_pdf]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every named source check
        env:
          SOURCE_POLICY_RESULT: ${{ needs.source_policy.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
          API_RESULT: ${{ needs.api.result }}
          TEX_SVG_RESULT: ${{ needs.tex_svg.result }}
          MARKDOWN_PDF_RESULT: ${{ needs.markdown_pdf.result }}
        run: |
          for result in "${SOURCE_POLICY_RESULT}" "${MARKDOWN_RESULT}" "${API_RESULT}" "${TEX_SVG_RESULT}" "${MARKDOWN_PDF_RESULT}"; do
            if [ "${result}" != 'success' ]; then
              echo '::error title=Renderer checks failed::Open the named failed check above for its focused log.'
              exit 1
            fi
          done
          echo 'All Renderer source checks passed.'
