# Standalone Linux deployment. Use deploy/start-local.mjs to generate the
# loopback-only credentials and require an exact reviewed Renderer image digest.
services:
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: renderer
      POSTGRES_USER: renderer
      POSTGRES_PASSWORD: ${RIN_RENDERER_LOCAL_DB_PASSWORD:?generated by start-local.mjs}
    volumes:
      - renderer-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderer -d renderer"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: "0.5"
    mem_limit: 384m
    pids_limit: 128

  migrate:
    image: ${RIN_RENDERER_IMAGE:?exact reviewed OCI digest required}
    network_mode: host
    command: ["rin-renderer-api", "migrate"]
    environment:
      RIN_RENDERER_DATABASE_URL: postgres://renderer:${RIN_RENDERER_LOCAL_DB_PASSWORD}@127.0.0.1:55432/renderer?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: "0.5"
    mem_limit: 384m
    pids_limit: 128

  api:
    image: ${RIN_RENDERER_IMAGE:?exact reviewed OCI digest required}
    network_mode: host
    environment: &renderer_env
      RIN_RENDERER_ADDR: 127.0.0.1:8090
      RIN_RENDERER_RUNTIME_ROLE: api
      RIN_RENDERER_COMPLETION_MODE: local
      RIN_RENDERER_STORAGE_PROVIDER: local
      RIN_RENDERER_DATABASE_URL: postgres://renderer:${RIN_RENDERER_LOCAL_DB_PASSWORD}@127.0.0.1:55432/renderer?sslmode=disable
      RIN_RENDERER_SCHEMA_MODE: require-current
      RIN_RENDERER_SERVICE_TOKEN: ${RIN_RENDERER_LOCAL_SERVICE_TOKEN:?generated by start-local.mjs}
      RIN_RENDERER_ARTIFACT_ROOT: /var/lib/rin-renderer/artifacts
      RIN_RENDERER_LOCAL_ASSET_ROOT: /var/lib/rin-renderer/public-assets
      RIN_RENDERER_LOCAL_PUBLIC_BASE_URL: http://127.0.0.1:8090
      RIN_RENDERER_TEXSVG_ENDPOINT: http://127.0.0.1:8091
      RIN_RENDERER_TEXSVG_TOKEN: ${RIN_RENDERER_LOCAL_SERVICE_TOKEN}
      RIN_RENDERER_MARKDOWN_NODE_BIN: /usr/local/bin/node
      RIN_RENDERER_MARKDOWN_SCRIPT: /opt/rin-renderer/engines/markdown/worker.mjs
      RIN_RENDERER_MARKDOWN_WORKER_COUNT: "1"
      RIN_RENDERER_MATHJAX_NODE_BIN: /usr/local/bin/node
      RIN_RENDERER_KATEX_NODE_BIN: /usr/local/bin/node
      RIN_RENDERER_DIAGRAM_PARALLELISM: "1"
      RIN_RENDERER_MATH_PARALLELISM: "1"
    volumes: &renderer_volumes
      - renderer-artifacts:/var/lib/rin-renderer/artifacts
      - renderer-public:/var/lib/rin-renderer/public-assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "rin-renderer-healthcheck", "http://127.0.0.1:8090/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: "0.5"
    mem_limit: 768m
    pids_limit: 128

  worker:
    image: ${RIN_RENDERER_IMAGE:?exact reviewed OCI digest required}
    network_mode: host
    environment:
      <<: *renderer_env
      RIN_RENDERER_ADDR: 127.0.0.1:8092
      RIN_RENDERER_RUNTIME_ROLE: worker
      RIN_RENDERER_WORKER_CONCURRENCY: "1"
    volumes: *renderer_volumes
    depends_on:
      api:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 2g
    pids_limit: 256

  texsvg:
    image: ${RIN_RENDERER_IMAGE:?exact reviewed OCI digest required}
    network_mode: host
    command: ["rin-renderer-texsvg"]
    environment:
      RIN_RENDERER_ADDR: 127.0.0.1:8091
      RIN_RENDERER_SERVICE_TOKEN: ${RIN_RENDERER_LOCAL_SERVICE_TOKEN:?generated by start-local.mjs}
    cpus: "1.0"
    mem_limit: 1536m
    pids_limit: 256

volumes:
  renderer-db:
  renderer-artifacts:
  renderer-public:
